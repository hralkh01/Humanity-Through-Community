<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Post</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

<nav>

    <h2>Humanity Through Community</h2>

    <div class="nav-links">

        <a href="../index.html">Home</a>

        <a href="#">Community</a>

        <a href="#">Resources</a>

        <a href="#">About</a>

    </div>

</nav>

<section class="create-post">

    <h1>Create a Post</h1>

    <p>
        Share a story, opportunity, question,
        act of kindness, or advice.
    </p>

    <form>

        <label>Title</label>

        <input
            type="text"
            placeholder="Enter post title">

        <label>Category</label>

        <select>

            <option>Advice</option>

            <option>Support</option>

            <option>Opportunity</option>

            <option>Success Story</option>

            <option>Acts of Kindness</option>

            <option>Events</option>

        </select>

        <label>Your Post</label>

        <textarea
            rows="8"
            placeholder="Write your message here...">
        </textarea>

        <button type="submit">

            Publish Post

        </button>

    </form>

</section>

</body>

</html>
